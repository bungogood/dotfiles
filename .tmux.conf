# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Split panes
bind | split-window -h
bind - split-window -v
bind c new-window -a -c "#{pane_current_path}"
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
# Promote the current window into its own session, named after its folder.
bind S run-shell "$HOME/.local/bin/tmux-promote-window \"#{window_id}\""

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
bind R run-shell -b 'tmux send-keys -t "#{pane_id}" "source ~/.bashrc" C-m'

# Mouse toggle
set -g mouse on
bind m set -g mouse on \; display-message "Mouse: ON"
bind M set -g mouse off \; display-message "Mouse: OFF"

# Clipboard integration
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-p previous-window
bind C-n next-window

# Jump to dev session window 1 which is htop & again to jump back
bind g run-shell "$HOME/.local/scripts/tmux-hop-dev.sh"

# Keep pane borders on terminal default color for active/inactive panes.
set -g pane-border-style fg=default
set -g pane-active-border-style fg=default

# When the current session is destroyed, switch to another session if available.
set -g detach-on-destroy off
bind-key f display-popup -E -x 0 -y 0 -w 100% -h 99% "$HOME/.local/bin/tmux-sessionizer"

# Naming and numbering
set -g automatic-rename on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# History
set -g history-limit 50000
